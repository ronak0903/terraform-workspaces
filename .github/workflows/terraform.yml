name: Create S3 Bucket

on:
  workflow_dispatch:
    inputs:

      bucket_name:
        description: "S3 bucket name"
        required: true
        type: string

      client:
        description: "Client name"
        required: true
        type: string

      environment:
        description: "Environment"
        required: true
        type: string

      region:
        description: "AWS region"
        required: true
        type: string

      purpose:
        description: "Purpose of the bucket"
        required: true
        type: string

      lifecycle_days:
        description: "Lifecycle retention in days"
        required: true
        type: number

      versioning:
        description: "Enable versioning"
        required: true
        type: boolean

      encryption:
        description: "Enable encryption"
        required: true
        type: boolean

      aws_account:
        description: "AWS account"
        required: true
        type: string

      port_run_id:
        description: "Port action run ID"
        required: true
        type: string

jobs:

  create-s3:

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_bucket_name: ${{ inputs.bucket_name }}
          TF_VAR_region: ${{ inputs.region }}
          TF_VAR_versioning: ${{ inputs.versioning }}
          TF_VAR_encryption: ${{ inputs.encryption }}
          TF_VAR_lifecycle_days: ${{ inputs.lifecycle_days }}
        run: |
          terraform apply -auto-approve
