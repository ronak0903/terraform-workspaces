name: Create S3 Bucket

on:
  workflow_dispatch:
    inputs:

      bucket_name:
        description: "S3 bucket name"
        required: true
        type: string

      client:
        description: "Client name"
        required: true
        type: string

      environment:
        description: "Environment"
        required: true
        type: string

      region:
        description: "AWS region"
        required: true
        type: string

      purpose:
        description: "Purpose of the bucket"
        required: true
        type: string

      lifecycle_days:
        description: "Lifecycle retention in days"
        required: true
        type: number

      versioning:
        description: "Enable versioning"
        required: true
        type: boolean

      encryption:
        description: "Enable encryption"
        required: true
        type: boolean

      aws_account:
        description: "AWS account ID"
        required: true
        type: string

      port_run_id:
        description: "Port action run ID"
        required: false
        type: string

jobs:

  create-s3:

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      # --------------------------------
      # 1. Checkout
      # --------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------
      # 2. Authenticate to AWS using OIDC
      # --------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      # --------------------------------
      # 3. Verify AWS authentication
      # --------------------------------

      - name: Verify AWS identity
        run: |
          echo "AWS Identity:"
          aws sts get-caller-identity

      # --------------------------------
      # 4. Install Terraform
      # --------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------
      # 5. Terraform Init
      # --------------------------------

      - name: Terraform Init
        working-directory: .
        run: |
          terraform init

      # --------------------------------
      # 6. Terraform Apply
      # --------------------------------

      - name: Terraform Apply
        env:
          TF_VAR_bucket_name: ${{ inputs.bucket_name }}
          TF_VAR_region: ${{ inputs.region }}
          TF_VAR_client: ${{ inputs.client }}
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_purpose: ${{ inputs.purpose }}
          TF_VAR_versioning: ${{ inputs.versioning }}
          TF_VAR_encryption: ${{ inputs.encryption }}
          TF_VAR_lifecycle_days: ${{ inputs.lifecycle_days }}

        run: |
          terraform apply -auto-approve
